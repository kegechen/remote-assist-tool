name: tests

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 与 release.yml 同理，钉 commit SHA 而非可变的 v4/v5 标签；由 dependabot 跟进。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24'
      - name: Build binaries (for e2e)
        shell: bash
        run: |
          mkdir -p bin
          go build -o bin/relay ./cmd/relay
          go build -o bin/remote ./cmd/remote
      - name: Run all tests
        shell: bash
        run: go test ./... -timeout 120s
      # 多 relay e2e 在上一步里因 CI 环境变量跳过：它要另编两个带 remoteassist_e2e tag 的二进制、起多个进程，
      # 挤在全量并行的 120s 里容易超时。这里单独跑、放宽超时。旧客户端兼容用 v1.2.3（最后一个不认节点列表的发布版），
      # 从 tag 源码编；RAT_DEPLOYED_RELAY（线上没有节点模式的 relay）在 CI 上没有，那一条跳过。
      - name: Build released CLI v1.2.3 (multi-relay compat)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          git fetch --depth=1 origin tag v1.2.3
          mkdir -p "$RUNNER_TEMP/rat-v123"
          git archive v1.2.3 | tar -x -C "$RUNNER_TEMP/rat-v123"
          go -C "$RUNNER_TEMP/rat-v123" build -o "$RUNNER_TEMP/cli-v123" ./cmd/remote
      - name: Multi-relay e2e
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          RAT_E2E_MULTI_RELAY: '1'
        run: RAT_RELEASED_CLI="$RUNNER_TEMP/cli-v123" go test ./tests/e2e/ -run MultiRelay -v -count=1 -timeout 10m
      - name: Race detector (internal packages)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: go test -race ./internal/... -timeout 180s
      # install.sh 是 "curl | sh" 安装链上唯一一道校验，go 工具链看不到它
      - name: install.sh checksum verification
        shell: bash
        run: bash tests/install/install_sh_test.sh
      - name: Benchmarks (ratelimit, observation only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: go test -run=^$ -bench=. -benchmem ./internal/ratelimit
