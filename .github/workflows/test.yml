name: tests

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 与 release.yml 同理，钉 commit SHA 而非可变的 v4/v5 标签；由 dependabot 跟进。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21'
      - name: Build binaries (for e2e)
        shell: bash
        run: |
          mkdir -p bin
          go build -o bin/relay ./cmd/relay
          go build -o bin/remote ./cmd/remote
      - name: Run all tests
        shell: bash
        run: go test ./... -timeout 120s
      - name: Race detector (internal packages)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: go test -race ./internal/... -timeout 180s
      # install.sh 是 "curl | sh" 安装链上唯一一道校验，go 工具链看不到它
      - name: install.sh checksum verification
        shell: bash
        run: bash tests/install/install_sh_test.sh
      - name: Benchmarks (ratelimit, observation only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: go test -run=^$ -bench=. -benchmem ./internal/ratelimit
