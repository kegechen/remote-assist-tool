name: Build and Upload Release Assets

on:
  release:
    types: [created]

permissions:
  contents: write

# 所有 action 一律钉到 commit SHA 而不是 v4/v5 这类可变标签。可变标签是会移动的
# 指针：上游仓库（或拿到其写权限的人）把 v4 重新指向另一个 commit，这里下一次发布
# 就会静默执行不同的代码，而 GITHUB_TOKEN 在本工作流里是 contents: write。SHA 是
# 内容寻址的，改不动。代价是补丁版本不会自动跟进，由 dependabot.yml 定期提 PR 补上。

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.21'

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # tag 名经 env 传入，不直接内插进 run 脚本。${{ }} 是在脚本落盘之前做的纯文本
          # 替换，而 tag 名是发布者可以随便写的字符串：一个叫 v1.0"; curl x|sh; " 的 tag
          # 会被 shell 当成命令跑掉，且此处 GITHUB_TOKEN 有 contents: write。走 env 之后
          # 它只是变量的值，shell 不会再解析一遍，下面用双引号包住即可。
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          ldflags="-X github.com/remote-assist/tool/internal/version.Version=$RELEASE_TAG"
          suf="${GOOS}-${GOARCH}${ext}"
          go build -ldflags "$ldflags" -o "dist/remote-assist-cli-${suf}" ./cmd/remote
          go build -ldflags "$ldflags" -o "dist/remote-assist-relay-${suf}" ./cmd/relay
          go build -ldflags "$ldflags" -o "dist/remote-assist-webui-${suf}" ./cmd/gui
        shell: bash

      - name: Upload Release Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SHA256SUMS 必须单独成 job：build 是 6 条并行的矩阵腿，每条只看得见自己那两三个
  # 产物，各自生成一份 SHA256SUMS 传上去只会互相覆盖，最后留下的那份是随机的一条腿。
  # 等 6 条腿全跑完再把产物取回来统一算，才是完整的清单。
  #
  # 这里用 runner 自带的 gh 而不是再引一个 upload-artifact/download-artifact 组合：
  # 少两个需要钉 SHA 和跟版本的依赖，产物本来也已经在 release 上了。
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 生成并上传 SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          # 只取二进制产物；不带上 SHA256SUMS 自己（重跑时它已经在 release 上了）
          gh release download "$RELEASE_TAG" --dir dist --pattern 'remote-assist-*'
          cd dist
          # sha256sum 的输出格式是 "<hash>  <文件名>"，install.sh 按这个格式解析
          sha256sum remote-assist-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
        shell: bash
